# Pure static site: nothing to build, just publish the repo root.
# `command = "true"` is an explicit no-op that always exits 0, overriding
# any stale build command auto-detected from the old Hexo setup.
[build]
  publish = "."
  command = "true"

# No secrets in this public static repo; skip scanning to avoid false
# positives on the minified DnD bundle under dnd/assets.
[build.environment]
  SECRETS_SCAN_ENABLED = "false"
